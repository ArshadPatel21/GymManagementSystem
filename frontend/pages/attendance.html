<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance | Gym Management System</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="app-container">
    <aside class="sidebar">
        <div class="logo">🏋️ FlexGym</div>
        <nav>
            <a href="../index.html">📊 Dashboard</a>
            <a href="members.html">👥 Members</a>
            <a href="trainers.html">🧑‍🏫 Trainers</a>
            <a href="memberships.html">🪪 Membership Plans</a>
            <a href="attendance.html" class="active">✅ Attendance</a>
            <a href="payments.html">💳 Payments</a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="topbar">
            <h1>Attendance</h1>
            <button class="btn btn-primary" onclick="openAttendanceModal()">+ Mark Attendance</button>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Member</th>
                        <th>Date</th>
                        <th>Check-in Time</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="attendanceTable">
                    <tr><td colspan="5" class="empty-state">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<div class="modal-overlay" id="attendanceModal">
    <div class="modal">
        <h2 id="attendanceModalTitle">Mark Attendance</h2>
        <form id="attendanceForm">
            <input type="hidden" id="attendanceId">
            <div class="form-grid">
                <div class="form-group">
                    <label>Member *</label>
                    <select id="memberSelect" required>
                        <option value="">-- Select Member --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Date *</label>
                    <input type="date" id="attendanceDate" required>
                </div>
                <div class="form-group">
                    <label>Check-in Time</label>
                    <input type="time" id="checkInTime">
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="attendanceStatus">
                        <option value="Present">Present</option>
                        <option value="Absent">Absent</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeAttendanceModal()">Cancel</button>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/attendance.js"></script>
</body>
</html>

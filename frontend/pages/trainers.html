<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trainers | Gym Management System</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="app-container">
    <aside class="sidebar">
        <div class="logo">🏋️ FlexGym</div>
        <nav>
            <a href="../index.html">📊 Dashboard</a>
            <a href="members.html">👥 Members</a>
            <a href="trainers.html" class="active">🧑‍🏫 Trainers</a>
            <a href="memberships.html">🪪 Membership Plans</a>
            <a href="attendance.html">✅ Attendance</a>
            <a href="payments.html">💳 Payments</a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="topbar">
            <h1>Trainers</h1>
            <button class="btn btn-primary" onclick="openTrainerModal()">+ Add Trainer</button>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Specialization</th>
                        <th>Salary</th>
                        <th>Joining Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="trainersTable">
                    <tr><td colspan="7" class="empty-state">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<div class="modal-overlay" id="trainerModal">
    <div class="modal">
        <h2 id="trainerModalTitle">Add Trainer</h2>
        <form id="trainerForm">
            <input type="hidden" id="trainerId">
            <div class="form-grid">
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" id="tName" required>
                </div>
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="tEmail" required>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" id="tPhone">
                </div>
                <div class="form-group">
                    <label>Specialization</label>
                    <input type="text" id="tSpecialization" placeholder="e.g. Strength Training">
                </div>
                <div class="form-group">
                    <label>Salary</label>
                    <input type="number" id="tSalary" step="0.01">
                </div>
                <div class="form-group">
                    <label>Joining Date</label>
                    <input type="date" id="tJoiningDate">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeTrainerModal()">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Trainer</button>
            </div>
        </form>
    </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/trainers.js"></script>
</body>
</html>

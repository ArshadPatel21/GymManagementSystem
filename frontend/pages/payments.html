<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payments | Gym Management System</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="app-container">
    <aside class="sidebar">
        <div class="logo">🏋️ FlexGym</div>
        <nav>
            <a href="../index.html">📊 Dashboard</a>
            <a href="members.html">👥 Members</a>
            <a href="trainers.html">🧑‍🏫 Trainers</a>
            <a href="memberships.html">🪪 Membership Plans</a>
            <a href="attendance.html">✅ Attendance</a>
            <a href="payments.html" class="active">💳 Payments</a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="topbar">
            <h1>Payments</h1>
            <button class="btn btn-primary" onclick="openPaymentModal()">+ Record Payment</button>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Member</th>
                        <th>Amount</th>
                        <th>Date</th>
                        <th>Method</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="paymentsTable">
                    <tr><td colspan="6" class="empty-state">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<!-- Add/Edit Payment Modal -->
<div class="modal-overlay" id="paymentModal">
    <div class="modal">
        <h2 id="paymentModalTitle">Record Payment</h2>
        <form id="paymentForm">
            <input type="hidden" id="paymentId">
            <div class="form-grid">
                <div class="form-group">
                    <label>Member *</label>
                    <select id="paymentMemberSelect" required>
                        <option value="">-- Select Member --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Amount *</label>
                    <input type="number" id="paymentAmount" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>Payment Date *</label>
                    <input type="date" id="paymentDate" required>
                </div>
                <div class="form-group">
                    <label>Payment Method</label>
                    <select id="paymentMethod">
                        <option value="Cash">Cash</option>
                        <option value="Card">Card</option>
                        <option value="UPI">UPI</option>
                        <option value="Bank Transfer">Bank Transfer</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="paymentStatus">
                        <option value="Paid">Paid</option>
                        <option value="Pending">Pending</option>
                        <option value="Failed">Failed</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closePaymentModal()">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Payment</button>
            </div>
        </form>
    </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/payments.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Members | Gym Management System</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="app-container">
    <aside class="sidebar">
        <div class="logo">🏋️ FlexGym</div>
        <nav>
            <a href="../index.html">📊 Dashboard</a>
            <a href="members.html" class="active">👥 Members</a>
            <a href="trainers.html">🧑‍🏫 Trainers</a>
            <a href="memberships.html">🪪 Membership Plans</a>
            <a href="attendance.html">✅ Attendance</a>
            <a href="payments.html">💳 Payments</a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="topbar">
            <h1>Members</h1>
            <button class="btn btn-primary" onclick="openMemberModal()">+ Add Member</button>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Plan</th>
                        <th>Trainer</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="membersTable">
                    <tr><td colspan="7" class="empty-state">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<!-- Add/Edit Member Modal -->
<div class="modal-overlay" id="memberModal">
    <div class="modal">
        <h2 id="memberModalTitle">Add Member</h2>
        <form id="memberForm">
            <input type="hidden" id="memberId">
            <div class="form-grid">
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" id="phone">
                </div>
                <div class="form-group">
                    <label>Gender</label>
                    <select id="gender">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Date of Birth</label>
                    <input type="date" id="dob">
                </div>
                <div class="form-group">
                    <label>Membership Plan</label>
                    <select id="membership_id">
                        <option value="">-- Select Plan --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Assigned Trainer</label>
                    <select id="trainer_id">
                        <option value="">-- Select Trainer --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="status">
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Address</label>
                <textarea id="address" rows="2"></textarea>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeMemberModal()">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Member</button>
            </div>
        </form>
    </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/members.js"></script>
</body>
</html>

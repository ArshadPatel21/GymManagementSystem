<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | Gym Management System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-container">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">🏋️ FlexGym</div>
        <nav>
            <a href="index.html" class="active">📊 Dashboard</a>
            <a href="pages/members.html">👥 Members</a>
            <a href="pages/trainers.html">🧑‍🏫 Trainers</a>
            <a href="pages/memberships.html">🪪 Membership Plans</a>
            <a href="pages/attendance.html">✅ Attendance</a>
            <a href="pages/payments.html">💳 Payments</a>
        </nav>
    </aside>

    <!-- Main content -->
    <main class="main-content">
        <div class="topbar">
            <h1>Dashboard</h1>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Members</h3>
                <p id="statMembers">--</p>
            </div>
            <div class="stat-card">
                <h3>Total Trainers</h3>
                <p id="statTrainers">--</p>
            </div>
            <div class="stat-card">
                <h3>Membership Plans</h3>
                <p id="statMemberships">--</p>
            </div>
            <div class="stat-card">
                <h3>Payments This Month</h3>
                <p id="statPayments">--</p>
            </div>
        </div>

        <div class="card">
            <h2>Recently Joined Members</h2>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Plan</th>
                        <th>Join Date</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="recentMembersTable">
                    <tr><td colspan="5" class="empty-state">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
